# ════════════════════════════════════════════════════════════
# Docker Compose — MinIO + DuckDB only
#
# Catatan:
#   - Airflow sudah berjalan terpisah (external)
#   - PostgreSQL AdventureWorks sudah ada (external)
#   - Stack ini hanya menyediakan MinIO (object storage)
#     dan volume persistent untuk DuckDB
#
# Setelah up, konfigurasi di Airflow kamu:
#   MINIO_ENDPOINT  = elt_minio:9000
#   MINIO_ACCESS_KEY= minioadmin
#   MINIO_SECRET_KEY= minioadmin123
#   MINIO_BUCKET    = adventureworks-elt
#   DUCKDB_PATH     = /path/di/airflow/kamu/duckdb/sales_performance.duckdb
# ════════════════════════════════════════════════════════════

services:

  # ── MinIO: Object Storage S3-compatible ───────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: elt_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"    # S3 API endpoint  → dipakai DAG & DuckDB
      - "9001:9001"    # MinIO Console UI → http://localhost:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - elt-net

  # ── MinIO Init: buat bucket otomatis saat pertama kali ────
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: elt_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        sleep 3 &&
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/adventureworks-elt &&
        echo '✅ Bucket adventureworks-elt siap'
      "
    restart: "no"
    networks:
      - elt-net

# ════════════════════════════════════════════════════════════
networks:
  elt-net:
    name: elt_pipeline_elt-net
    driver: bridge

volumes:
  minio-data:
